services:
  client:
    build:
      target: dev
    develop:
      watch:
        - action: sync
          path: ./client/assets
          target: /app/client/assets
        - action: sync
          path: ./client/src
          target: /app/client/src
        - action: rebuild
          path: ./client
          ignore:
            - .svelte-kit/
            - assets/
            - src/
        - action: rebuild
          path: ./engine/src
        - action: rebuild
          path: ./engine/Cargo.toml
        - action: rebuild
          path: ./engine/Cargo.lock
    environment:
      CLIENT_PORT: ${CLIENT_PORT:-1234}
      SERVER_HOST: server
    image: words-client-dev
    ports: !override
      - '${CLIENT_PORT:-1234}:${CLIENT_PORT:-1234}'

  server:
    develop:
      watch:
        - action: rebuild
          path: ./server
          ignore:
            - dist/
        - action: rebuild
          path: ./engine/src
        - action: rebuild
          path: ./engine/Cargo.toml
        - action: rebuild
          path: ./engine/Cargo.lock

  storybook:
    build:
      context: .
      dockerfile: client/Dockerfile
      target: dev
    command: ['npm', 'run', 'storybook', '--', '--ci', '--host', '0.0.0.0']
    develop:
      watch:
        - action: sync
          path: ./client/assets
          target: /app/client/assets
        - action: sync
          path: ./client/src
          target: /app/client/src
        - action: rebuild
          path: ./client
          ignore:
            - .svelte-kit/
            - assets/
            - src/
    ports:
      - '127.0.0.1:6006:6006'
    restart: unless-stopped
